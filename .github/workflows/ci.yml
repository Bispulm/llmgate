name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: llmgate
          POSTGRES_PASSWORD: llmgate_dev
          POSTGRES_DB: llmgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmgate -d llmgate"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LLMGATE_TEST_POSTGRES_URL: postgres://llmgate:llmgate_dev@127.0.0.1:5432/llmgate?sslmode=disable
      LLMGATE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # A skipped integration test must fail here, or a misconfiguration could
      # silently stop proving database behavior.
      LLMGATE_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -p 2 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The scanner lists a pull request's commits to know what to scan.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint the chart
        run: helm lint deploy/helm/llmgate
      - name: Check the configuration the chart renders
        run: |
          # A release name other than llmgate, so a hardcoded name would show up here.
          helm template prod deploy/helm/llmgate --set mock.enabled=true --show-only templates/configmap.yaml \
            | yq 'select(document_index == 0) | .data["config.yaml"]' > rendered.yaml
          grep -q 'http://prod-mock:18301/v1' rendered.yaml
          go run ./cmd/llmgate validate --config rendered.yaml
      - name: Check the Compose configurations
        run: |
          docker compose config --quiet
          docker compose --profile stack config --quiet
          go run ./cmd/llmgate validate --config configs/compose.yaml
      # Builds the image, installs the chart on kind with the mock, and restarts it under
      # traffic. Nothing calls a real provider.
      - name: Test the chart on kind
        run: ./scripts/kind-test.sh
