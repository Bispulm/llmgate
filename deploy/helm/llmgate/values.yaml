# Values for the llmgate chart. Postgres and Redis aren't part of the chart: point the
# gateway at your own, through the Secret named in secret.name.

image:
  repository: llmgate
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 2

# The Secret holding credentials, with these keys:
#   database-url, redis-url, admin-token, and one per provider (see config.providers).
# The chart never creates it, so credentials stay out of values files.
secret:
  name: llmgate

# Runs `llmgate migrate` as a hook before install and upgrade. The gateway never
# migrates by itself.
migrate:
  enabled: true

# A deterministic mock provider, for demos and tests. It never calls a real provider.
mock:
  enabled: false

# How long Kubernetes waits for a stopping pod. It has to cover the drain delay, the
# drain itself, and settling, or a long completion is cut off and charged its full
# reservation. Keep it above drain_delay + shutdown_timeout + 30s.
terminationGracePeriodSeconds: 170

# The gateway's configuration file, as documented in docs/admin.md. Credentials are
# named by environment variable here, and come from the Secret. Values are rendered as
# templates, so they can refer to the release, as the mock's URL does.
config:
  server:
    listen: 0.0.0.0:18300
    # Keep serving while not ready, and ask clients to close their connections, so
    # Services and connection pools move to other pods first.
    drain_delay: 5s
    # Longer than limits.request_timeout plus settling, so requests in flight at shutdown
    # can finish rather than being cut off.
    shutdown_timeout: 130s
  auth:
    mode: tenant
    key_cache_ttl: 30s
  database:
    url_env: LLMGATE_DATABASE_URL
  redis:
    url_env: LLMGATE_REDIS_URL
  admin:
    # Behind the admin token, and on its own Service so it can be kept off any ingress.
    # Any pod in the cluster can reach the port unless networkPolicy is enabled.
    listen: 0.0.0.0:18302
    token_env: LLMGATE_ADMIN_TOKEN
    allow_non_loopback: true
  metrics:
    listen: 0.0.0.0:18303
    allow_non_loopback: true
  pricing:
    version: demo-2026-11-05
    prices:
      - provider: mock
        model: alpha;tokens=5;interval=100ms
        input_usd_per_mtok: "3.00"
        cached_input_usd_per_mtok: "0.30"
        cache_write_usd_per_mtok: "3.75"
        output_usd_per_mtok: "15.00"
  providers:
    - name: mock
      type: openai-compatible
      base_url: "http://{{ .Release.Name }}-mock:18301/v1"
      api_key_env: LLMGATE_MOCK_PROVIDER_KEY
      allow_insecure_http: true
  models:
    - alias: demo-fast
      max_output_tokens: 256
      routes:
        - provider: mock
          model: alpha;tokens=5;interval=100ms

# Environment variables read from the Secret, by variable name and Secret key. Add one
# per provider credential.
secretEnv:
  LLMGATE_DATABASE_URL: database-url
  LLMGATE_REDIS_URL: redis-url
  LLMGATE_ADMIN_TOKEN: admin-token
  LLMGATE_MOCK_PROVIDER_KEY: mock-provider-key

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi

podDisruptionBudget:
  minAvailable: 1

# Restricts who can reach the admin API and metrics ports. The gateway port stays open to
# all. Only takes effect where the cluster's network plugin enforces NetworkPolicy.
networkPolicy:
  enabled: false
  # NetworkPolicy peers allowed to reach the admin API, such as a namespaceSelector for
  # an operations namespace.
  adminFrom: []
  # Peers allowed to scrape metrics, such as the Prometheus namespace.
  metricsFrom: []
