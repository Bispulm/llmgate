{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "llmgate.name" . }}
  labels:
    {{- include "llmgate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llmgate
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 18300
    {{- with .Values.networkPolicy.adminFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 18302
    {{- end }}
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: 18303
    {{- end }}
{{- end }}
